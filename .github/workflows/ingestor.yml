name: Ingestor y clasificador

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install feedparser anthropic

      - name: Ejecutar ingestor
        run: python ingestor.py

      - name: Ejecutar clasificador
        run: python clasificador.py

      - name: Commit y push si hubo cambios
        run: |
          if git diff --quiet datos_radar.json; then
            echo "Sin cambios en datos_radar.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FECHA_UTC=$(date -u +"%Y-%m-%d %H:%M UTC")
          git add datos_radar.json
          git commit -m "datos: actualización automática ${FECHA_UTC}"
          git push
